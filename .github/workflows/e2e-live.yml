name: Live e2e

# nsq end to end with the real agent CLIs (Claude Code, Codex, OpenCode 1.x and 2.x) on every
# desktop OS, against the scripted fake model of scripts/e2e/fake-model.mjs on localhost: dummy
# keys, a sandboxed HOME and config folders per run, no real model and no secrets (there are none
# in this workflow). Per OS and harness: statuses (working / needs you with the question /
# finished), inline answer, interrupt, resume after a daemon restart, worktree, cost against the
# fake's log, OpenRouter attribution headers, the phone API; plus the dashboard in a real pty
# (recorded: GIF/MP4/PNG per OS), its BEL/OSC 9 ring when no desktop notification can show, and
# dictation from synthesised speech through Whisper tiny.en. Not a required check: it takes a
# while and depends on upstream CLIs. See scripts/e2e-ci/live.mjs.

on:
  pull_request:
    paths:
      - apps/cli/**
      - packages/**
      - scripts/e2e/**
      - scripts/e2e-ci/**
      - package-lock.json
      - .github/workflows/e2e-live.yml
  schedule:
    # Nightly, on the newest CLI releases of each line (pull requests run the pinned ones).
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Code to test (branch, tag or SHA); empty = the ref this runs on
        required: false
        default: ''
      clis:
        description: CLI versions (scripts/e2e-ci/clis.json)
        type: choice
        options: [pinned, latest]
        default: pinned

permissions:
  contents: read

concurrency:
  group: e2e-live-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CLI_CHANNEL: ${{ inputs.clis || (github.event_name == 'schedule' && 'latest') || 'pinned' }}

jobs:
  live:
    name: ${{ matrix.suite }} (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, windows-2025]
        suite: [claude, codex, opencode-1, opencode-2, dashboard]
        include:
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: ubuntu-24.04, label: linux-x64 }
          - { os: windows-2025, label: windows-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Check out the e2e scripts of this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .e2e-ci
          sparse-checkout: scripts/e2e-ci
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The dashboard is first checked with no display at all (SSH, servers), then recorded
      # against a virtual X server, where its dictation hotkey has an X display to hook.
      - name: Speech engine (espeak-ng) for dictation, a virtual X server for the recording
        if: matrix.suite == 'dashboard' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends espeak-ng xvfb
          Xvfb :99 -screen 0 1280x800x24 +extension RECORD > /dev/null 2>&1 &
          echo "E2E_DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Cache the dictation test model
        if: matrix.suite == 'dashboard'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/models
          key: dictation-whisper-tiny.en-d026532c

      - name: Install the real CLIs into an isolated prefix
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set_name=main
          if [ "$SUITE" = opencode-2 ]; then set_name=oc2; fi
          node .e2e-ci/scripts/e2e-ci/install-clis.mjs \
            --prefix "$RUNNER_TEMP/clis" --channel "$CLI_CHANNEL" --sets "$set_name"

      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
          LABEL: ${{ matrix.label }}
        run: |
          node .e2e-ci/scripts/e2e-ci/live.mjs --suite "$SUITE" --os-label "$LABEL" \
            --root "$GITHUB_WORKSPACE" --clis "$RUNNER_TEMP/clis" --out "$RUNNER_TEMP/out" \
            --models "$RUNNER_TEMP/models" ${E2E_DISPLAY:+--display "$E2E_DISPLAY"}

      # An artifact upload that fails on the runner's network (ENOTFOUND) is not a test result.
      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.suite }}-${{ matrix.label }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/out/results.json
            ${{ runner.temp }}/out/*/checks.json
            ${{ runner.temp }}/out/*/fake-requests.jsonl
            ${{ runner.temp }}/out/*/nsq/daemon.log
            ${{ runner.temp }}/out/recording/
            !${{ runner.temp }}/out/recording/work/

  report:
    name: report and recordings
    needs: live
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code under test (term-dump, render-frames)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Check out the e2e scripts of this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .e2e-ci
          sparse-checkout: scripts/e2e-ci
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/results

      - name: Report
        run: |
          node .e2e-ci/scripts/e2e-ci/report.mjs "$RUNNER_TEMP/results" \
            --out "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/results.json" > /dev/null
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Renderers (agg, Pillow, ffmpeg)
        env:
          AGG_VERSION: v1.9.0
          AGG_SHA256: f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6
        run: |
          curl -fsSL -o "$RUNNER_TEMP/agg" \
            "https://github.com/asciinema/agg/releases/download/$AGG_VERSION/agg-x86_64-unknown-linux-gnu"
          echo "$AGG_SHA256  $RUNNER_TEMP/agg" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/agg"
          sudo apt-get install -y --no-install-recommends python3-pil ffmpeg fonts-dejavu-core

      - name: Render the dashboard recordings
        run: |
          node .e2e-ci/scripts/e2e-ci/render.mjs --root "$GITHUB_WORKSPACE" \
            --in "$RUNNER_TEMP/results" --out "$RUNNER_TEMP/recordings" --agg "$RUNNER_TEMP/agg"
          mkdir -p "$RUNNER_TEMP/recordings"
          cp "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/results.json" "$RUNNER_TEMP/recordings/"

      - name: Upload the recordings
        # Also what did render when one picture failed (the job still fails).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-recordings
          retention-days: 30
          path: ${{ runner.temp }}/recordings/
