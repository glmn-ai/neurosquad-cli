name: Bug report
description: Something in nsq does not work as expected.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/glmn-ai/neurosquad-cli/issues) first.
        **Security vulnerabilities must not be reported here** — see [SECURITY.md](https://github.com/glmn-ai/neurosquad-cli/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. nsq run claude "…"
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nsq version
      description: Output of `nsq --version` (or the commit if built from source).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and shell
      placeholder: "Windows Terminal + PowerShell 7, iTerm2 + zsh, tmux over SSH…"
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      multiple: true
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Generic command
        - Other / not related
  - type: input
    id: harness-version
    attributes:
      label: Harness version
      placeholder: "claude --version, codex --version…"
  - type: textarea
    id: logs
    attributes:
      label: Logs and `nsq doctor` output
      description: Remove tokens, keys and private paths before pasting.
      render: shell
