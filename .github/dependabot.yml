version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # @types/node tracks the minimum Node we support (engines: >=22.13). Typing against a newer
      # major lets code use APIs that crash on Node 22. Raise it only together with `engines`.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the native compiler) is not supported by typescript-eslint yet (its peer
      # range is <6.1.0 as of 8.71). Drop this once a typescript-eslint release accepts TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
      npm-major:
        update-types: ['major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['dependencies']
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns: ['*']
